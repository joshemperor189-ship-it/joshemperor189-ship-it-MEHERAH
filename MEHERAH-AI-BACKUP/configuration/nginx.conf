user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Elegant, descriptive logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access_log.log main;

    sendfile on;
    keepalive_timeout 65;

    # Production Rate Limiting (Prevents DDoS on API endpoints)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # HTTP Redirect to HTTPS
    server {
        listen 80;
        server_name localhost meherah.internal;
        return 301 https://$host$request_uri;
    }

    # HTTPS Production Gateway
    server {
        listen 443 ssl;
        server_name localhost meherah.internal;

        # TLS Credentials (Placeholders for certificates)
        ssl_certificate /etc/nginx/certs/meherah.crt;
        ssl_certificate_key /etc/nginx/certs/meherah.key;

        # Hardened TLS Protocols & Ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # mTLS (Mutual TLS Verification Structure Placeholder for Banking Connectors)
        # ssl_client_certificate /etc/nginx/certs/ca.crt;
        # ssl_verify_client optional; # or "on" to enforce strictly

        # Strong Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; connect-src 'self';" always;

        location / {
            proxy_pass http://meherah-os:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Inject verified client certificate subject line to backend if mTLS is enabled
            # proxy_set_header X-Client-Cert-Verified $ssl_client_verify;
            # proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        }

        # Rate limited API endpoints
        location /api/ {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://meherah-os:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
