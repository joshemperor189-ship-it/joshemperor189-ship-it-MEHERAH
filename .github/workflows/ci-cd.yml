# ==========================================
# MEHERAH OS - CI/CD BUILD & DEPLOYMENT WORKFLOW
# ==========================================

name: Meherah OS CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Validation & Quality Gates
  validate-and-test:
    name: Lint, Typecheck, and Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Node.js v20 Environment
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Code Style Linter
        run: npm run lint

      - name: Run Comprehensive Test Suite (8 Test Domains)
        run: npm test

  # 2. Package and Release Artifacts (Runs only on main branch success)
  package-and-build:
    name: Build & Push Docker Image
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/meherah-os:latest
            ghcr.io/${{ github.repository }}/meherah-os:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
